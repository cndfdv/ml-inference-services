services:
  # Основной сервис OCR. Поднимается всегда.
  ocr:
    container_name: ocr_paddleocr_1
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      # По умолчанию 8002, чтобы не конфликтовать с asr-gigaam (8000) и
      # embedder (8001).
      - "${PORT:-8002}:8000"
    volumes:
      # Кеш весов HuggingFace (HF_HOME=/app/models). Качается один раз, дальше
      # сервис берёт веса отсюда — офлайн.
      - ./models:/app/models
      # Временная папка для загруженных файлов: удаляются сразу после
      # распознавания, сервис ничего не хранит.
      - ./tmp:/app/tmp
    restart: unless-stopped
    # Healthcheck дёргает GET /health (модель не поднимает — выгрузке по простою
    # не мешает). curl в slim-образе нет, поэтому проверяем через stdlib urllib.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)
      interval: 30s
      timeout: 10s
      # start_period большой: первый healthcheck не должен падать, пока сервис
      # поднимается (импорт torch/transformers). Саму модель /health не грузит.
      start_period: 60s
      retries: 3
    # Опционально: жёсткий потолок памяти. OCR-VL прожорлив по RAM — при желании
    # ограничь, но не слишком туго, иначе OOM на крупных страницах.
    # mem_limit: 6g

  # Разовое скачивание весов с HuggingFace в кеш. Не стартует обычным `up` —
  # запускается явно: docker compose --profile prepare run --rm prepare
  # Переиспользует основной образ, только команда другая.
  prepare:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    profiles: ["prepare"]
    volumes:
      - ./models:/app/models
    command: ["python", "download_model.py"]
