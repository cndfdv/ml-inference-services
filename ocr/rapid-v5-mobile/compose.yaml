services:
  rapid-v5-mobile:
    image: ml-services-rapid-v5-mobile:local
    build: .
    init: true
    restart: unless-stopped
    profiles: [ocr, rapid-v5-mobile, all]
    environment:
      MODEL_ID: "rapid-v5-mobile"
      MODEL_DIR: "/models"
      DEVICE: "${OCR_DEVICE:-cpu}"
      WORKERS: "${OCR_WORKERS:-1}"
      PREPARE_MODE: "${OCR_PREPARE_MODE:-auto}"
      CPU_THREADS: "${CPU_THREADS:-4}"
      MAX_BATCH_SIZE: "${MAX_BATCH_SIZE:-16}"
      MAX_BATCH_TOKENS: "${MAX_BATCH_TOKENS:-8192}"
      BATCH_WAIT_MS: "${BATCH_WAIT_MS:-10}"
      MAX_QUEUE_ITEMS: "${MAX_QUEUE_ITEMS:-256}"
      REQUEST_TIMEOUT_S: "${REQUEST_TIMEOUT_S:-600}"
      MAX_REQUEST_ITEMS: "${MAX_REQUEST_ITEMS:-64}"
      MAX_REQUEST_BODY_BYTES: "${MAX_REQUEST_BODY_BYTES:-67108864}"
      REC_BATCH_SIZE: "${REC_BATCH_SIZE:-6}"
      PDF_DPI: "${PDF_DPI:-150}"
      MAX_IMAGE_BYTES: "${MAX_IMAGE_BYTES:-10485760}"
      MAX_IMAGE_PIXELS: "${MAX_IMAGE_PIXELS:-20000000}"
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${OCR_PORT:-18103}:8000"]
    volumes: [rapid-v5-mobile-weights:/models]
    networks: [model-inference]
volumes:
  rapid-v5-mobile-weights:
    name: ml-services-rapid-v5-mobile-weights
networks:
  model-inference:
    name: model-inference
