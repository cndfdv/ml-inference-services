name: Model inference contracts

on:
  pull_request:
    paths: ['model-inference/**', '.github/workflows/model-inference.yml']
  push:
    paths: ['model-inference/**', '.github/workflows/model-inference.yml']

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model-inference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: >-
          python -m pip install -r requirements-dev.txt
          fastapi==0.115.12 pydantic==2.11.4 httpx==0.28.1
          Pillow==11.2.1 numpy==2.2.6 python-multipart==0.0.20 pypdfium2==4.30.0
      - name: API, scheduler and backend contract tests
        run: python -m pytest -q
      - name: Shell and Compose configurations
        run: |
          bash -n scripts/compose.sh scripts/run.sh
          for mode in cpu gpu wsl; do
            bash scripts/compose.sh --mode "$mode" config --quiet
          done
