services:
  # Основной сервис эмбеддингов. Поднимается всегда.
  embedder:
    container_name: embedder_1
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      # По умолчанию 8001, чтобы не конфликтовать с asr-gigaam (8000).
      - "${PORT:-8001}:8000"
    volumes:
      # Кеш HuggingFace с весами модели (HF_HOME=/app/models). Качается один
      # раз, дальше сервис берёт модель отсюда — офлайн.
      - ./models:/app/models
    restart: unless-stopped
    # Healthcheck дёргает GET /health (модель не поднимает — выгрузке по простою
    # не мешает). curl в slim-образе нет, поэтому проверяем через stdlib urllib.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)
      interval: 30s
      timeout: 10s
      # start_period большой: первый healthcheck не должен падать, пока сервис
      # поднимается (импорт torch и т.п.). Саму модель /health не грузит.
      start_period: 40s
      retries: 3
    # Опционально: жёсткий потолок памяти, чтобы сервис не разрастался. Под
    # bge-m3 (fp32, ~2 ГБ на загруженную модель) бери с запасом.
    # mem_limit: 3g

  # Разовое скачивание модели с HuggingFace в кеш. Не стартует обычным `up` —
  # запускается явно: docker compose --profile prepare run --rm prepare
  # Переиспользует основной образ, только команда другая.
  prepare:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    profiles: ["prepare"]
    volumes:
      - ./models:/app/models
    command: ["python", "download_model.py"]
